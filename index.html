<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 10 3D Shapes Learning</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    .app-container {
      width: 100%;
      min-height: 100%;
      padding: 50px 20px;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 50px;
    }

    .header h1 {
      font-size: 56px;
      margin: 0 0 15px 0;
      font-weight: 700;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
      letter-spacing: -1px;
    }

    .header p {
      font-size: 22px;
      margin: 0;
      opacity: 0.95;
      font-weight: 300;
    }

    .content-wrapper {
      max-width: 1600px;
      margin: 0 auto;
    }

    .shapes-section {
      margin-bottom: 60px;
    }

    .section-title {
      color: white;
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 30px;
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .shapes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      margin-bottom: 40px;
    }

    .shape-card {
      background: white;
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .shape-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .shape-card:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .shape-card:hover::before {
      opacity: 1;
    }

    .shape-visual {
      width: 100%;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      position: relative;
    }

    .shape-name {
      font-size: 28px;
      font-weight: 700;
      color: #1e293b;
      text-align: center;
      margin-bottom: 20px;
    }

    .shape-info {
      background: #f8fafc;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .shape-info h4 {
      font-size: 16px;
      color: #64748b;
      margin: 0 0 12px 0;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 15px;
      color: #334155;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
    }

    .info-label {
      font-weight: 600;
      color: #475569;
    }

    .info-value {
      color: #1e40af;
      font-weight: 500;
    }

    .formula-section {
      margin-top: 15px;
    }

    .formula {
      background: white;
      border-left: 4px solid #667eea;
      padding: 12px 15px;
      margin: 8px 0;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #334155;
    }

    .formula strong {
      color: #667eea;
      font-weight: 700;
    }

    .quiz-container {
      background: white;
      border-radius: 24px;
      padding: 50px 40px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      max-width: 900px;
      margin: 0 auto;
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h2 {
      font-size: 38px;
      color: #1e293b;
      margin: 0 0 15px 0;
      font-weight: 700;
    }

    .quiz-progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
    }

    .progress-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e2e8f0;
      transition: all 0.3s ease;
    }

    .progress-dot.completed {
      background: #10b981;
    }

    .progress-dot.current {
      background: #667eea;
      transform: scale(1.4);
    }

    .score-badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .question-container {
      margin-bottom: 35px;
    }

    .question-number {
      color: #667eea;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .question-text {
      font-size: 24px;
      color: #1e293b;
      line-height: 1.6;
      margin-bottom: 30px;
      font-weight: 500;
    }

    .options-container {
      display: grid;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: #f8fafc;
      border: 3px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px 25px;
      font-size: 18px;
      color: #334155;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      position: relative;
      overflow: hidden;
    }

    .option-btn::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: #667eea;
      transform: scaleY(0);
      transition: transform 0.3s ease;
    }

    .option-btn:hover:not(.correct):not(.incorrect) {
      background: #f1f5f9;
      border-color: #667eea;
      transform: translateX(8px);
    }

    .option-btn:hover::before {
      transform: scaleY(1);
    }

    .option-btn.correct {
      background: #d1fae5;
      border-color: #10b981;
      color: #065f46;
      font-weight: 700;
    }

    .option-btn.correct::after {
      content: '✓';
      position: absolute;
      right: 25px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 28px;
      color: #10b981;
    }

    .option-btn.incorrect {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
      font-weight: 700;
    }

    .option-btn.incorrect::after {
      content: '✗';
      position: absolute;
      right: 25px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 28px;
      color: #ef4444;
    }

    .option-btn:disabled {
      cursor: not-allowed;
    }

    .quiz-actions {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .quiz-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 18px 45px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .quiz-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    .quiz-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      box-shadow: none;
    }

    .quiz-btn.secondary {
      background: #64748b;
    }

    .quiz-btn.secondary:hover {
      background: #475569;
    }

    .feedback-container {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feedback-container.correct {
      background: #d1fae5;
      color: #065f46;
    }

    .feedback-container.incorrect {
      background: #fee2e2;
      color: #991b1b;
    }

    .feedback-container.empty {
      background: transparent;
    }

    .final-results {
      text-align: center;
      padding: 40px 20px;
    }

    .final-score {
      font-size: 72px;
      font-weight: 700;
      color: #667eea;
      margin: 20px 0;
    }

    .performance-message {
      font-size: 28px;
      color: #334155;
      margin: 20px 0;
      font-weight: 600;
    }

    .results-breakdown {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin: 30px 0;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .result-stat {
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
    }

    .result-stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 5px;
    }

    .result-stat-label {
      font-size: 14px;
      color: #64748b;
      font-weight: 600;
    }

    @keyframes rotate3d {
      from { transform: rotateY(0deg) rotateX(10deg); }
      to { transform: rotateY(360deg) rotateX(10deg); }
    }

    .rotating {
      animation: rotate3d 8s linear infinite;
      transform-style: preserve-3d;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 36px;
      }
      
      .shapes-grid {
        grid-template-columns: 1fr;
      }
      
      .quiz-container {
        padding: 30px 20px;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <main class="app-container">
   <header class="header">
    <h1 id="app-title">Grade 10: 3D Shapes Mastery</h1>
    <p id="subtitle">Master volume, surface area, and properties of three-dimensional shapes</p>
   </header>
   <div class="content-wrapper">
    <section class="shapes-section">
     <h2 class="section-title">📐 Study Guide: 3D Shapes</h2>
     <div class="shapes-grid" id="shapes-grid"></div>
    </section>
    <section class="quiz-container" id="quiz-container">
     <div class="quiz-header">
      <h2 id="quiz-title">Knowledge Assessment Quiz</h2>
      <div class="quiz-progress" id="quiz-progress"></div>
      <div class="score-badge" id="score-badge">
       Score: 0/10
      </div>
     </div>
     <div id="quiz-content">
      <div class="question-container">
       <div class="question-number" id="question-number"></div>
       <div class="question-text" id="question-text"></div>
      </div>
      <div class="options-container" id="options-container"></div>
      <div class="quiz-actions"><button class="quiz-btn" id="next-btn">Next Question</button> <button class="quiz-btn secondary" id="restart-btn" style="display: none;">Restart Quiz</button>
      </div>
      <div class="feedback-container empty" id="feedback"></div>
     </div>
     <div id="final-results" style="display: none;"></div>
    </section>
   </div>
  </main>
  <script>
    const defaultConfig = {
      app_title: "Grade 10: 3D Shapes Mastery",
      subtitle: "Master volume, surface area, and properties of three-dimensional shapes",
      cube_label: "Cube",
      sphere_label: "Sphere",
      cylinder_label: "Cylinder",
      cone_label: "Cone",
      pyramid_label: "Square Pyramid",
      prism_label: "Triangular Prism",
      quiz_title: "Knowledge Assessment Quiz",
      quiz_button: "Next Question",
      restart_button: "Restart Quiz",
      background_color: "#1e3c72",
      surface_color: "#ffffff",
      text_color: "#1e293b",
      accent_color: "#667eea",
      button_color: "#10b981",
      font_family: "Inter",
      font_size: 16
    };

    const shapes = [
      {
        id: 'cube',
        configKey: 'cube_label',
        faces: 6,
        vertices: 8,
        edges: 12,
        volumeFormula: 'V = s³',
        surfaceAreaFormula: 'SA = 6s²',
        svg: '<svg viewBox="0 0 200 200" width="160" height="160"><g class="rotating"><rect x="40" y="80" width="60" height="60" fill="#60a5fa" stroke="#1e40af" stroke-width="3"/><path d="M100,80 L130,50 L130,110 L100,140 Z" fill="#3b82f6" stroke="#1e40af" stroke-width="3"/><path d="M40,80 L70,50 L130,50 L100,80 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="3"/></g></svg>'
      },
      {
        id: 'sphere',
        configKey: 'sphere_label',
        faces: 1,
        vertices: 0,
        edges: 0,
        volumeFormula: 'V = (4/3)πr³',
        surfaceAreaFormula: 'SA = 4πr²',
        svg: '<svg viewBox="0 0 200 200" width="160" height="160"><defs><radialGradient id="sphereGrad"><stop offset="30%" stop-color="#fb923c"/><stop offset="100%" stop-color="#ea580c"/></radialGradient></defs><g class="rotating"><circle cx="100" cy="100" r="65" fill="url(#sphereGrad)" stroke="#9a3412" stroke-width="3"/><ellipse cx="100" cy="100" rx="65" ry="20" fill="none" stroke="#9a3412" stroke-width="2" opacity="0.5"/><ellipse cx="100" cy="100" rx="20" ry="65" fill="none" stroke="#9a3412" stroke-width="2" opacity="0.5"/></g></svg>'
      },
      {
        id: 'cylinder',
        configKey: 'cylinder_label',
        faces: 3,
        vertices: 0,
        edges: 2,
        volumeFormula: 'V = πr²h',
        surfaceAreaFormula: 'SA = 2πr² + 2πrh',
        svg: '<svg viewBox="0 0 200 200" width="160" height="160"><defs><linearGradient id="cylGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs><g class="rotating"><ellipse cx="100" cy="55" rx="55" ry="18" fill="#6ee7b7" stroke="#047857" stroke-width="3"/><rect x="45" y="55" width="110" height="90" fill="url(#cylGrad)" stroke="none"/><line x1="45" y1="55" x2="45" y2="145" stroke="#047857" stroke-width="3"/><line x1="155" y1="55" x2="155" y2="145" stroke="#047857" stroke-width="3"/><ellipse cx="100" cy="145" rx="55" ry="18" fill="#34d399" stroke="#047857" stroke-width="3"/></g></svg>'
      },
      {
        id: 'cone',
        configKey: 'cone_label',
        faces: 2,
        vertices: 1,
        edges: 1,
        volumeFormula: 'V = (1/3)πr²h',
        surfaceAreaFormula: 'SA = πr² + πrl',
        svg: '<svg viewBox="0 0 200 200" width="160" height="160"><defs><linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient></defs><g class="rotating"><ellipse cx="100" cy="155" rx="65" ry="20" fill="#fcd34d" stroke="#b45309" stroke-width="3"/><path d="M35,155 L100,35 L165,155" fill="url(#coneGrad)" stroke="#b45309" stroke-width="3"/></g></svg>'
      },
      {
        id: 'pyramid',
        configKey: 'pyramid_label',
        faces: 5,
        vertices: 5,
        edges: 8,
        volumeFormula: 'V = (1/3)s²h',
        surfaceAreaFormula: 'SA = s² + 2sl',
        svg: '<svg viewBox="0 0 200 200" width="160" height="160"><defs><linearGradient id="pyrGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#9333ea"/></linearGradient></defs><g class="rotating"><path d="M100,35 L35,155 L165,155 Z" fill="url(#pyrGrad)" stroke="#6b21a8" stroke-width="3"/><path d="M100,35 L165,155 L140,165 Z" fill="#a855f7" stroke="#6b21a8" stroke-width="3"/><path d="M35,155 L165,155 L140,165 L60,165 Z" fill="#d8b4fe" stroke="#6b21a8" stroke-width="3"/></g></svg>'
      },
      {
        id: 'prism',
        configKey: 'prism_label',
        faces: 5,
        vertices: 6,
        edges: 9,
        volumeFormula: 'V = (1/2)bhl',
        surfaceAreaFormula: 'SA = bh + 2ls + lb',
        svg: '<svg viewBox="0 0 200 200" width="160" height="160"><defs><linearGradient id="prismGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient></defs><g class="rotating"><path d="M50,140 L100,60 L150,140 Z" fill="#fbcfe8" stroke="#9f1239" stroke-width="3"/><path d="M50,140 L100,60 L100,150 Z" fill="url(#prismGrad)" stroke="#9f1239" stroke-width="3"/><path d="M100,60 L150,140 L100,150 Z" fill="#f472b6" stroke="#9f1239" stroke-width="3"/><path d="M50,140 L100,150 L150,140 Z" fill="#fda4af" stroke="#9f1239" stroke-width="3"/></g></svg>'
      }
    ];

    const quizQuestions = [
      {
        question: "A cube has a side length of 5 cm. What is its volume?",
        options: ["25 cm³", "75 cm³", "125 cm³", "150 cm³"],
        correct: 2,
        explanation: "Volume of cube = s³ = 5³ = 125 cm³"
      },
      {
        question: "What is the surface area formula for a sphere with radius r?",
        options: ["2πr²", "4πr²", "πr²", "(4/3)πr³"],
        correct: 1,
        explanation: "Surface area of sphere = 4πr²"
      },
      {
        question: "A cylinder has radius 3 cm and height 10 cm. What is its volume? (Use π ≈ 3.14)",
        options: ["94.2 cm³", "188.4 cm³", "282.6 cm³", "376.8 cm³"],
        correct: 2,
        explanation: "Volume = πr²h = 3.14 × 3² × 10 = 3.14 × 9 × 10 = 282.6 cm³"
      },
      {
        question: "Which 3D shape has exactly one vertex?",
        options: ["Cylinder", "Cone", "Pyramid", "Prism"],
        correct: 1,
        explanation: "A cone has exactly one vertex at its apex"
      },
      {
        question: "A cube has surface area of 150 cm². What is the length of one side?",
        options: ["5 cm", "6 cm", "25 cm", "15 cm"],
        correct: 0,
        explanation: "SA = 6s², so 150 = 6s², s² = 25, s = 5 cm"
      },
      {
        question: "What is the relationship between the volume of a cone and a cylinder with the same base and height?",
        options: ["Cone volume is half", "Cone volume is one-third", "They are equal", "Cone volume is two-thirds"],
        correct: 1,
        explanation: "Volume of cone is exactly 1/3 of cylinder volume with same dimensions"
      },
      {
        question: "A sphere has a radius of 6 cm. What is its volume? (Use π ≈ 3.14)",
        options: ["452.16 cm³", "678.24 cm³", "904.32 cm³", "1017.36 cm³"],
        correct: 2,
        explanation: "V = (4/3)πr³ = (4/3) × 3.14 × 6³ = (4/3) × 3.14 × 216 = 904.32 cm³"
      },
      {
        question: "How many edges does a triangular prism have?",
        options: ["6", "7", "8", "9"],
        correct: 3,
        explanation: "A triangular prism has 9 edges: 3 on each triangular face (6 total) plus 3 connecting edges"
      },
      {
        question: "A square pyramid has a base side of 8 cm and height of 12 cm. What is its volume?",
        options: ["128 cm³", "192 cm³", "256 cm³", "384 cm³"],
        correct: 2,
        explanation: "V = (1/3)s²h = (1/3) × 8² × 12 = (1/3) × 64 × 12 = 256 cm³"
      },
      {
        question: "Which shape has the same number of faces, vertices, and edges?",
        options: ["Cube", "Sphere", "None of them", "Triangular Prism"],
        correct: 2,
        explanation: "No common 3D shape has equal numbers of faces, vertices, and edges"
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;
    let answeredQuestions = new Array(quizQuestions.length).fill(false);

    function renderShapes() {
      const grid = document.getElementById('shapes-grid');
      grid.innerHTML = '';
      
      shapes.forEach(shape => {
        const card = document.createElement('div');
        card.className = 'shape-card';
        
        const shapeName = window.elementSdk.config[shape.configKey] || defaultConfig[shape.configKey];
        
        card.innerHTML = `
          <div class="shape-visual">${shape.svg}</div>
          <div class="shape-name">${shapeName}</div>
          <div class="shape-info">
            <h4>Properties</h4>
            <div class="info-grid">
              <div class="info-item">
                <span class="info-label">Faces:</span>
                <span class="info-value">${shape.faces}</span>
              </div>
              <div class="info-item">
                <span class="info-label">Vertices:</span>
                <span class="info-value">${shape.vertices}</span>
              </div>
              <div class="info-item">
                <span class="info-label">Edges:</span>
                <span class="info-value">${shape.edges}</span>
              </div>
            </div>
          </div>
          <div class="formula-section">
            <div class="shape-info">
              <h4>Formulas</h4>
              <div class="formula"><strong>Volume:</strong> ${shape.volumeFormula}</div>
              <div class="formula"><strong>Surface Area:</strong> ${shape.surfaceAreaFormula}</div>
            </div>
          </div>
        `;
        
        grid.appendChild(card);
      });
    }

    function renderProgressDots() {
      const progressContainer = document.getElementById('quiz-progress');
      progressContainer.innerHTML = '';
      
      quizQuestions.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        if (answeredQuestions[index]) {
          dot.classList.add('completed');
        }
        if (index === currentQuestion) {
          dot.classList.add('current');
        }
        progressContainer.appendChild(dot);
      });
    }

    function renderQuestion() {
      const question = quizQuestions[currentQuestion];
      
      document.getElementById('question-number').textContent = `Question ${currentQuestion + 1} of ${quizQuestions.length}`;
      document.getElementById('question-text').textContent = question.question;
      
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';
      
      question.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = option;
        btn.onclick = () => selectAnswer(index);
        optionsContainer.appendChild(btn);
      });
      
      const feedback = document.getElementById('feedback');
      feedback.textContent = '';
      feedback.className = 'feedback-container empty';
      
      answered = false;
      updateNextButton();
      renderProgressDots();
    }

    function selectAnswer(index) {
      if (answered) return;
      
      answered = true;
      answeredQuestions[currentQuestion] = true;
      const question = quizQuestions[currentQuestion];
      const options = document.querySelectorAll('.option-btn');
      const feedback = document.getElementById('feedback');
      
      options.forEach(opt => opt.disabled = true);
      
      if (index === question.correct) {
        options[index].classList.add('correct');
        feedback.textContent = `✓ Correct! ${question.explanation}`;
        feedback.className = 'feedback-container correct';
        score++;
      } else {
        options[index].classList.add('incorrect');
        options[question.correct].classList.add('correct');
        feedback.textContent = `✗ Incorrect. ${question.explanation}`;
        feedback.className = 'feedback-container incorrect';
      }
      
      updateScore();
      updateNextButton();
      renderProgressDots();
    }

    function updateScore() {
      document.getElementById('score-badge').textContent = `Score: ${score}/${quizQuestions.length}`;
    }

    function updateNextButton() {
      const nextBtn = document.getElementById('next-btn');
      const config = window.elementSdk.config;
      nextBtn.textContent = config.quiz_button || defaultConfig.quiz_button;
      nextBtn.disabled = !answered;
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion >= quizQuestions.length) {
        showResults();
      } else {
        renderQuestion();
      }
    }

    function showResults() {
      const quizContent = document.getElementById('quiz-content');
      const finalResults = document.getElementById('final-results');
      const nextBtn = document.getElementById('next-btn');
      const restartBtn = document.getElementById('restart-btn');
      
      quizContent.style.display = 'none';
      nextBtn.style.display = 'none';
      restartBtn.style.display = 'inline-block';
      finalResults.style.display = 'block';
      
      const percentage = Math.round((score / quizQuestions.length) * 100);
      let message = '';
      let emoji = '';
      
      if (percentage >= 90) {
        message = 'Outstanding! You\'ve mastered 3D shapes!';
        emoji = '🏆';
      } else if (percentage >= 70) {
        message = 'Great job! You have a solid understanding!';
        emoji = '⭐';
      } else if (percentage >= 50) {
        message = 'Good effort! Review the formulas and try again!';
        emoji = '📚';
      } else {
        message = 'Keep practicing! Study the shapes guide above.';
        emoji = '💪';
      }
      
      finalResults.innerHTML = `
        <div class="final-results">
          <div style="font-size: 80px; margin-bottom: 20px;">${emoji}</div>
          <div class="final-score">${percentage}%</div>
          <div class="performance-message">${message}</div>
          <div class="results-breakdown">
            <div class="result-stat">
              <div class="result-stat-value">${score}</div>
              <div class="result-stat-label">Correct</div>
            </div>
            <div class="result-stat">
              <div class="result-stat-value">${quizQuestions.length - score}</div>
              <div class="result-stat-label">Incorrect</div>
            </div>
            <div class="result-stat">
              <div class="result-stat-value">${quizQuestions.length}</div>
              <div class="result-stat-label">Total</div>
            </div>
          </div>
        </div>
      `;
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      answered = false;
      answeredQuestions.fill(false);
      
      const quizContent = document.getElementById('quiz-content');
      const finalResults = document.getElementById('final-results');
      const nextBtn = document.getElementById('next-btn');
      const restartBtn = document.getElementById('restart-btn');
      
      quizContent.style.display = 'block';
      nextBtn.style.display = 'inline-block';
      restartBtn.style.display = 'none';
      finalResults.style.display = 'none';
      
      renderQuestion();
      updateScore();
    }

    async function onConfigChange(config) {

      const customFont = config.font_family || defaultConfig.font_family;
      const baseFontStack = '-apple-system, BlinkMacSystemFont, sans-serif';

      document.getElementById('app-title').textContent = config.app_title || defaultConfig.app_title;
      document.getElementById('app-title').style.fontSize = `${baseSize * 3.5}px`;

      document.getElementById('subtitle').textContent = config.subtitle || defaultConfig.subtitle;
      document.getElementById('subtitle').style.fontSize = `${baseSize * 1.375}px`;
      document.getElementById('subtitle').style.color = config.surface_color || defaultConfig.surface_color;
      
      document.getElementById('quiz-title').textContent = config.quiz_title || defaultConfig.quiz_title;
      document.getElementById('quiz-title').style.fontSize = `${baseSize * 2.375}px`;
      document.getElementById('quiz-title').style.color = config.text_color || defaultConfig.text_color;
      
      const nextBtn = document.getElementById('next-btn');
      nextBtn.style.fontSize = `${baseSize * 1.125}px`;
      nextBtn.style.background = `linear-gradient(135deg, ${config.accent_color || defaultConfig.accent_color}, ${config.button_color || defaultConfig.button_color})`;
      
      const restartBtn = document.getElementById('restart-btn');
      restartBtn.textContent = config.restart_button || defaultConfig.restart_button;
      restartBtn.style.fontSize = `${baseSize * 1.125}px`;
      
      document.querySelectorAll('.shape-card').forEach(el => {
        el.style.background = config.surface_color || defaultConfig.surface_color;
      });
      
      document.querySelectorAll('.shape-name').forEach(el => {
        el.style.fontSize = `${baseSize * 1.75}px`;
        el.style.color = config.text_color || defaultConfig.text_color;
      });
      
      document.querySelectorAll('.formula strong').forEach(el => {
        el.style.color = config.accent_color || defaultConfig.accent_color;
      });
      
      document.querySelector('.quiz-container').style.background = config.surface_color || defaultConfig.surface_color;
      
      document.getElementById('question-text').style.fontSize = `${baseSize * 1.5}px`;
      document.getElementById('question-text').style.color = config.text_color || defaultConfig.text_color;
      
      document.querySelectorAll('.option-btn').forEach(el => {
        el.style.fontSize = `${baseSize * 1.125}px`;
      });
      
      renderShapes();
    }

    window.elementSdk.init({
      defaultConfig,
      onConfigChange,
      mapToCapabilities: (config) => ({

              window.elementSdk.setConfig({ background_color: value });
            }
          },
          {

            set: (value) => {
              config.surface_color = value;
              window.elementSdk.setConfig({ surface_color: value });
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              config.text_color = value;
              window.elementSdk.setConfig({ text_color: value });
            }
          },
          {
            get: () => config.accent_color || defaultConfig.accent_color,
            set: (value) => {
              config.accent_color = value;
              window.elementSdk.setConfig({ accent_color: value });
            }
          },
          {
            get: () => config.button_color || defaultConfig.button_color,
            set: (value) => {
              config.button_color = value;
              window.elementSdk.setConfig({ button_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => {
            config.font_family = value;
            window.elementSdk.setConfig({ font_family: value });
          }
        },
        fontSizeable: {
          get: () => config.font_size || defaultConfig.font_size,
          set: (value) => {
            config.font_size = value;
            window.elementSdk.setConfig({ font_size: value });
          }
        }
      }),
      mapToEditPanelValues: (config) => new Map([
        ["app_title", config.app_title || defaultConfig.app_title],
        ["subtitle", config.subtitle || defaultConfig.subtitle],
        ["cube_label", config.cube_label || defaultConfig.cube_label],
        ["sphere_label", config.sphere_label || defaultConfig.sphere_label],
        ["cylinder_label", config.cylinder_label || defaultConfig.cylinder_label],
        ["cone_label", config.cone_label || defaultConfig.cone_label],
        ["pyramid_label", config.pyramid_label || defaultConfig.pyramid_label],
        ["prism_label", config.prism_label || defaultConfig.prism_label],
        ["quiz_title", config.quiz_title || defaultConfig.quiz_title],
        ["quiz_button", config.quiz_button || defaultConfig.quiz_button],
        ["restart_button", config.restart_button || defaultConfig.restart_button]
      ])
    });

    document.getElementById('next-btn').addEventListener('click', nextQuestion);
    document.getElementById('restart-btn').addEventListener('click', restartQuiz);

    renderShapes();
    renderQuestion();
    updateScore();
  </script>
